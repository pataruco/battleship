jetstream {
  store_dir: /data
}

websocket {
  port: 9222
  no_tls: true
}

accounts {
  APP {
    jetstream: enabled
    users: [
      { user: admin, password: admin-dev }
      {
        user: browser
        password: browser-dev
        allowed_connection_types: ["WEBSOCKET"]
        permissions: {
          publish: {
            allow: [
              "$KV.bship_games.g.*"
              "$JS.API.DIRECT.GET.KV_bship_games.$KV.bship_games.g.*"
              "bship.*.here"
            ]
          }
          subscribe: {
            allow: ["_INBOX.>", "bship.*.here"]
          }
        }
      }
    ]
  }
}
