name: Deploy to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_NATS_URL: ${{ vars.VITE_NATS_URL }}
      VITE_KV_BUCKET: ${{ vars.VITE_KV_BUCKET }}
      VITE_NATS_AUTH: creds
      VITE_NATS_CREDS: ${{ secrets.VITE_NATS_CREDS }}
    steps:
      - name: Require the NATS settings
        run: |
          missing=0
          for name in VITE_NATS_URL VITE_KV_BUCKET VITE_NATS_CREDS; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty; set it (repository variable, or secret for VITE_NATS_CREDS) before deploying."
              missing=1
            fi
          done
          exit $missing

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The action's README says a pinned commit must be on master, and master needs `toolchain`.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # No dependency cache in the workflow that can publish the site.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.59.0

      # Not "just setup": that would create .env with local values.
      - run: just install
      - run: just build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
